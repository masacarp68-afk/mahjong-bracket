<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>麻雀トーナメント表</title>
<style>
  :root {
    --bg: #f4f0e6;
    --paper: #fffdf8;
    --ink: #24231f;
    --muted: #6d6a60;
    --line: #d9d3c3;
    --felt: #1f5c4a;
    --felt-soft: #e2eee8;
    --accent: #b5361f;
    --accent-soft: #f8e6e0;
    --warn: #8a5a00;
    --warn-soft: #fbf0d4;
    --radius: 8px;
    --on-bg: #24231f;
    --on-bg-muted: #6d6a60;
    --round-line: #1f5c4a;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background-color: var(--bg);
    background-attachment: fixed;
    color: var(--ink);
    font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic UI", "Yu Gothic", Meiryo, sans-serif;
    font-size: 15px;
    line-height: 1.6;
  }
  header {
    background: var(--felt);
    color: #fff;
    padding: 14px 20px;
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }
  h1 {
    margin: 0;
    font-family: "Hiragino Mincho ProN", "Yu Mincho", serif;
    font-size: 22px;
    letter-spacing: .08em;
  }
  header .info { font-size: 13px; opacity: .85; margin-right: auto; }
  main { padding: 20px; }

  button {
    font: inherit;
    cursor: pointer;
    border-radius: 6px;
    border: 1px solid var(--line);
    background: var(--paper);
    color: var(--ink);
    padding: 6px 14px;
  }
  button:hover { border-color: var(--felt); }
  button:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 700; padding: 10px 28px; font-size: 16px; }
  button.primary:disabled { background: var(--line); border-color: var(--line); color: var(--muted); cursor: not-allowed; }
  header button { background: transparent; color: #fff; border-color: rgba(255,255,255,.5); font-size: 13px; }
  header button:hover { border-color: #fff; }
  header button.confirming { background: var(--accent); border-color: var(--accent); }

  /* 入力画面 */
  .setup { max-width: 620px; margin: 0 auto; }
  .setup h2 { font-size: 17px; margin: 0 0 4px; color: var(--on-bg); }
  .setup p { margin: 0 0 12px; color: var(--on-bg-muted); font-size: 14px; }
  textarea {
    width: 100%;
    min-height: 300px;
    padding: 12px;
    font: inherit;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    background: var(--paper);
    color: var(--ink);
    resize: vertical;
  }
  .setup-foot { display: flex; align-items: center; gap: 16px; margin-top: 12px; flex-wrap: wrap; }
  .count { font-weight: 700; color: var(--on-bg); }
  .preview { color: var(--on-bg-muted); font-size: 13px; }
  .notice { margin-top: 12px; padding: 8px 12px; border-radius: 6px; font-size: 13px; background: var(--warn-soft); color: var(--warn); }
  .seed-picker { margin-top: 14px; padding: 12px; background: var(--paper); border: 1px solid var(--line); border-radius: var(--radius); }
  .seed-head { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 4px 12px; font-size: 14px; font-weight: 700; color: var(--ink); }
  .seed-head span { font-weight: 400; color: var(--muted); }
  .seed-note { margin: 2px 0 10px; font-size: 12px; color: var(--muted); }
  .seed-list { display: flex; flex-wrap: wrap; gap: 6px; max-height: 260px; overflow-y: auto; padding: 2px; }
  .chip:disabled { color: var(--muted); background: transparent; border-color: var(--line); cursor: not-allowed; }

  /* トーナメント表 */
  .champion {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px 20px;
    margin-bottom: 16px;
    padding: 16px 20px;
    background: var(--paper);
    border: 2px solid var(--accent);
    border-radius: var(--radius);
    color: var(--ink);
  }
  .champion-label { padding: 4px 14px; border-radius: 6px; background: var(--accent); color: #fff; font-size: 18px; font-weight: 700; }
  .champion-name { min-width: 0; font-family: "Hiragino Mincho ProN", "Yu Mincho", serif; font-size: clamp(30px, 6vw, 56px); line-height: 1.2; overflow-wrap: anywhere; }
  .champion-second { color: var(--muted); font-size: 16px; }
  .champion button { margin-left: auto; font-weight: 700; }

  /* 優勝者の全画面表示 */
  .champion-screen {
    position: fixed;
    inset: 0;
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 4vmin;
    cursor: pointer;
  }
  .champion-card {
    box-sizing: border-box;
    width: min(92vw, 1500px);
    max-height: 92vh;
    padding: 5vmin 4vmin;
    overflow: hidden;
    background: var(--paper);
    border: 4px solid var(--accent);
    border-radius: 16px;
    color: var(--ink);
    text-align: center;
  }
  .champion-card img { display: block; max-width: 40%; max-height: 18vh; margin: 0 auto 2vmin; object-fit: contain; }
  .champion-card-title { margin: 0 0 3vmin; font-family: "Hiragino Mincho ProN", "Yu Mincho", serif; font-size: clamp(20px, 4vmin, 48px); font-weight: 700; overflow-wrap: anywhere; }
  .champion-card-label { display: inline-block; padding: .1em .8em; border-radius: 10px; background: var(--accent); color: #fff; font-size: clamp(24px, 6vmin, 72px); font-weight: 700; }
  .champion-card-name { margin: 2vmin 0 3vmin; font-family: "Hiragino Mincho ProN", "Yu Mincho", serif; font-size: 18vmin; font-weight: 700; line-height: 1.15; white-space: nowrap; }
  .champion-card-second { margin: 0; color: var(--muted); font-size: clamp(18px, 4vmin, 48px); overflow-wrap: anywhere; }
  .champion-card-hint { margin: 2vmin 0 0; color: var(--muted); font-size: 14px; }
  .bracket { position: relative; display: flex; gap: 40px; overflow-x: auto; padding-bottom: 12px; align-items: stretch; }
  .round { position: relative; z-index: 1; flex: 0 0 256px; display: flex; flex-direction: column; }
  .round-body { flex: 1; display: flex; flex-direction: column; justify-content: center; }
  .round-links { position: absolute; top: 0; left: 0; pointer-events: none; }
  .round-links path { fill: none; stroke: var(--on-bg-muted); stroke-width: 2; }
  .round-head {
    display: flex;
    align-items: baseline;
    gap: 8px;
    margin-bottom: 10px;
    padding-bottom: 6px;
    border-bottom: 2px solid var(--round-line);
  }
  .round-head h2 { margin: 0; font-size: 16px; font-family: "Hiragino Mincho ProN", "Yu Mincho", serif; color: var(--on-bg); }
  .round-head span { font-size: 12px; color: var(--on-bg-muted); }
  .table {
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    margin-bottom: 12px;
    overflow: hidden;
  }
  .table.done { border-color: var(--felt); }
  .table-head {
    display: flex;
    justify-content: space-between;
    padding: 4px 10px;
    background: var(--felt-soft);
    font-size: 13px;
    font-weight: 700;
    color: var(--felt);
  }
  .table-head small { font-weight: 400; color: var(--muted); }
  .seat {
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 5px 6px 5px 10px;
    border-top: 1px solid var(--line);
    min-height: 38px;
  }
  .seat-name { flex: 1; min-width: 0; overflow-wrap: anywhere; font-size: 14px; }
  .seat-name.pending { color: var(--muted); font-size: 13px; }
  .seat-origin { display: block; font-size: 11px; color: var(--muted); line-height: 1.3; }
  .seat.hl { background: var(--warn-soft); }
  .rank-btn { padding: 1px 7px; font-size: 12px; flex: none; color: var(--muted); }
  .rank-btn[aria-pressed="true"] { background: var(--felt); border-color: var(--felt); color: #fff; font-weight: 700; }
  .byes { margin-bottom: 12px; padding: 8px 10px; background: var(--paper); border: 1px dashed var(--line); border-radius: var(--radius); font-size: 13px; }
  .byes strong { display: block; font-size: 12px; color: var(--accent); }
  .byes ul { display: grid; grid-template-columns: repeat(auto-fill, minmax(90px, 1fr)); gap: 0 8px; margin: 2px 0 0; padding: 0; list-style: none; overflow-wrap: anywhere; }
  .byes li[data-player] { cursor: default; }
  .byes li.hl { background: var(--warn-soft); }
  .help { margin-top: 12px; font-size: 13px; color: var(--on-bg-muted); }

  /* 共有 */
  #share-slot { max-width: 1400px; margin: 0 auto; padding: 12px 16px 0; }
  #share-slot:empty { display: none; }
  .share-box { padding: 10px 12px; background: var(--paper); border: 1px solid var(--line); border-radius: var(--radius); color: var(--ink); font-size: 13px; }
  .share-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  .share-status { font-weight: 700; }
  .share-status::before { content: ''; display: inline-block; width: 9px; height: 9px; margin-right: 6px; border-radius: 50%; background: var(--muted); }
  .share-status.online::before { background: var(--felt); }
  .share-status.offline { color: var(--warn); }
  .share-status.offline::before { background: var(--warn); }
  .share-note { margin: 6px 0 0; color: var(--muted); font-size: 12px; }
  .share-link { flex: 1 1 260px; min-width: 0; padding: 5px 8px; font: inherit; color: var(--ink); background: #fff; border: 1px solid var(--line); border-radius: 6px; }
  .share-box button.confirming { background: var(--accent); border-color: var(--accent); color: #fff; }
  .share-loading { padding: 40px 0; text-align: center; color: var(--on-bg); }

  /* デザイン・画像保存 */
  #design-slot:not(:empty) { padding: 20px 20px 0; }
  .toolbar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
  .toolbar select, .toolbar button { font: inherit; }
  .toolbar select { padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--paper); color: var(--ink); }
  .toolbar .save { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 700; }
  .export-status { font-size: 13px; color: var(--on-bg); }
  .design-panel { background: var(--paper); border: 1px solid var(--line); border-radius: var(--radius); margin-bottom: 12px; }
  .design-panel summary { cursor: pointer; padding: 8px 12px; font-weight: 700; }
  .design-body { padding: 4px 12px 12px; display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); }
  .field { min-width: 0; }
  .field-label { display: block; font-size: 13px; font-weight: 700; margin-bottom: 4px; }
  .field input[type="text"] { width: 100%; padding: 6px 8px; font: inherit; border: 1px solid var(--line); border-radius: 6px; background: #fff; color: var(--ink); }
  .field .row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .file-button { display: inline-block; padding: 6px 14px; border: 1px solid var(--line); border-radius: 6px; background: var(--paper); cursor: pointer; }
  .file-button:hover { border-color: var(--felt); }
  .file-button:focus-within { outline: 2px solid var(--accent); outline-offset: 1px; }
  .file-button input { position: absolute; width: 1px; height: 1px; opacity: 0; }
  .logo-thumb { height: 36px; max-width: 96px; object-fit: contain; }
  .chip { font-size: 13px; padding: 4px 10px; }
  .chip[aria-pressed="true"] { background: var(--felt); border-color: var(--felt); color: #fff; font-weight: 700; }
  .swatch { display: inline-flex; vertical-align: -2px; margin-right: 6px; border: 1px solid rgba(0,0,0,.25); border-radius: 3px; overflow: hidden; }
  .swatch i { display: block; width: 12px; height: 12px; }
  .color-input { display: inline-flex; align-items: center; gap: 4px; font-size: 13px; }
  .color-input input { width: 36px; height: 28px; padding: 1px; border: 1px solid var(--line); border-radius: 4px; background: #fff; cursor: pointer; }
  .event-head { display: flex; align-items: center; gap: 14px; background: var(--paper); border: 1px solid var(--line); border-radius: var(--radius); padding: 10px 14px; margin-bottom: 4px; }
  .event-head img { height: 56px; max-width: 140px; object-fit: contain; flex: none; }
  .event-head strong { font-family: "Hiragino Mincho ProN", "Yu Mincho", serif; font-size: 22px; overflow-wrap: anywhere; min-width: 0; }
  @media (max-width: 600px) {
    main { padding: 16px; }
    #design-slot:not(:empty) { padding: 16px 16px 0; }
    .round { flex-basis: 232px; }
  }
</style>
</head>
<body>
<header>
  <h1>麻雀トーナメント表</h1>
  <span class="info" id="info"></span>
  <span id="header-actions"></span>
</header>
<div id="share-slot"></div>
<div id="design-slot"></div>
<main id="app"></main>

<script>
/*LOGIC-START*/
function secureRandom() {
  if (typeof crypto !== 'undefined' && crypto.getRandomValues) {
    return crypto.getRandomValues(new Uint32Array(1))[0] / 4294967296;
  }
  return Math.random();
}

function shuffled(items, rng) {
  const a = items.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(rng() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

/** 貼り付けられた文字列を名前の一覧にする。改行・タブ・カンマで区切る(姓名の間の空白は残す)。 */
function parseNames(text) {
  return text
    .split(/[\r\n\t,、，]+/)
    .map(s => s.replace(/^[\s　]+|[\s　]+$/g, ''))
    .filter(Boolean);
}

function findDuplicates(names) {
  const seen = new Set(), dup = new Set();
  names.forEach(n => (seen.has(n) ? dup.add(n) : seen.add(n)));
  return [...dup];
}

/** 0→A, 25→Z, 26→AA */
function tableLabel(i) {
  let s = '';
  for (let n = i + 1; n > 0; n = Math.floor((n - 1) / 26)) {
    s = String.fromCharCode(65 + (n - 1) % 26) + s;
  }
  return s;
}

/**
 * K人の回の卓構成。4人以下は決勝。
 * 次の回が 4・8・16・32・64… になるよう、必要な卓だけ打ち、残りをシードにする。
 * 4人卓は2人、3人卓は1人減らせるので、減らす人数が奇数なら3人卓を1つ入れる。
 */
function roundShape(k) {
  if (k <= 4) return { sizes: [k], byes: 0 };
  let field = 4;
  while (field * 2 <= k) field *= 2;
  if (field === k) return { sizes: new Array(k / 4).fill(4), byes: 0 };
  const reduce = k - field;
  const sizes = new Array(Math.floor(reduce / 2)).fill(4);
  if (reduce % 2) sizes.push(3);
  const seated = sizes.reduce((sum, size) => sum + size, 0);
  return { sizes, byes: k - seated };
}

/** シード指定を今の参加者に合わせて整理する。いない人・重複・枠を超えた分を外す。 */
function normalizeSeeds(names, seeds, slots) {
  return [...new Set(seeds)].filter(name => names.includes(name)).slice(0, slots);
}

function overlapCount(a, b) {
  let n = 0;
  a.anc.forEach(x => { if (b.anc.has(x)) n++; });
  return n;
}

function groupScore(members) {
  let score = 0, firsts = 0, seconds = 0, seeds = 0;
  for (let i = 0; i < members.length; i++) {
    if (members[i].rank === 0) seeds++;
    if (members[i].rank === 1) firsts++;
    if (members[i].rank === 2) seconds++;
    for (let j = i + 1; j < members.length; j++) {
      if (members[i].last && members[i].last === members[j].last) score += 1000; // 再戦が確定
      else score += overlapCount(members[i], members[j]) * 10; // 再戦の可能性
    }
  }
  // 2乗で数えて、シードと勝ち上がりが卓ごとに偏らないようにする
  return score + Math.abs(firsts - seconds) * 3 + seeds * seeds * 4;
}

/** 1回戦の卓が偶数で端数なしのときの基本形: A1・C1・B2・D2 / B1・D1・A2・C2 */
function crossTables(slots) {
  const firsts = slots.filter(s => s.rank === 1);
  const seconds = slots.filter(s => s.rank === 2);
  const m = firsts.length / 2;
  const tables = [];
  for (let j = 0; j < m; j++) {
    const n = (j + 1) % m;
    tables.push([firsts[j], seconds[n], firsts[j + m], seconds[n + m]]);
  }
  return tables;
}

function isCleanCross(slots) {
  const k = slots.length;
  if (k % 4 !== 0) return false;
  const firsts = slots.filter(s => s.rank === 1).length;
  const seconds = slots.filter(s => s.rank === 2).length;
  return firsts === k / 2 && seconds === k / 2;
}

/** 山登りで1回戦分の席を決める。2回戦以降は人数が 8・16・32… なので全員が卓に入る。 */
function searchRound(slots, rng) {
  const { sizes } = roundShape(slots.length);
  const groups = sizes.map(() => []);
  shuffled(slots, rng).forEach(slot => {
    let best = -1, bestDelta = Infinity;
    groups.forEach((g, i) => {
      if (g.length >= sizes[i]) return;
      const delta = groupScore(g.concat(slot)) - groupScore(g) + rng() * 0.01;
      if (delta < bestDelta) { bestDelta = delta; best = i; }
    });
    groups[best].push(slot);
  });

  let improved = true;
  while (improved) {
    improved = false;
    for (let a = 0; a < groups.length; a++) {
      for (let b = a + 1; b < groups.length; b++) {
        for (let i = 0; i < groups[a].length; i++) {
          for (let j = 0; j < groups[b].length; j++) {
            const before = groupScore(groups[a]) + groupScore(groups[b]);
            [groups[a][i], groups[b][j]] = [groups[b][j], groups[a][i]];
            if (groupScore(groups[a]) + groupScore(groups[b]) < before) improved = true;
            else [groups[a][i], groups[b][j]] = [groups[b][j], groups[a][i]];
          }
        }
      }
    }
  }
  return groups;
}

/** 表示用に、席を元の卓順(シードは最後)に、卓を先頭の席の順に並べる */
function sortTables(groups) {
  const order = slot => (slot.ref.t === undefined ? Number.MAX_SAFE_INTEGER : slot.ref.t * 2 + slot.ref.rank);
  groups.forEach(group => group.sort((a, b) => order(a) - order(b)));
  return groups.sort((a, b) => order(a[0]) - order(b[0]));
}

function buildOnce(n, seeds, rng) {
  const first = roundShape(n);
  // 指定されたシードを後ろに置く。後ろから順にシード枠になり、余った枠は抽選で埋まる。
  const chosen = seeds.slice(0, first.byes);
  const order = shuffled([...Array(n).keys()].filter(p => !chosen.includes(p)), rng).concat(chosen);
  const rounds = [];
  let total = 0;

  // 1回戦: 抽選順にそのまま座る。余りがシード。
  let cursor = 0;
  let current = first.sizes.map(size => {
    const seated = order.slice(cursor, cursor + size).map(p => ({ ref: { p }, last: null, anc: new Set(), rank: 0 }));
    cursor += size;
    return seated;
  });
  let byeList = order.slice(cursor).map(p => ({ ref: { p }, last: null, anc: new Set(), rank: 0 }));

  for (let r = 0; ; r++) {
    rounds.push({
      tables: current.map(group => ({ slots: group.map(s => s.ref) })),
      byes: byeList.map(s => s.ref),
    });
    if (current.length === 1 && byeList.length === 0) break; // 決勝

    // 次の回へ進む枠を作る
    const next = [];
    current.forEach((group, t) => {
      const anc = new Set([`${r}-${t}`]);
      group.forEach(s => s.anc.forEach(x => anc.add(x)));
      next.push(
        { ref: { r, t, rank: 1 }, last: `${r}-${t}`, anc, rank: 1 },
        { ref: { r, t, rank: 2 }, last: `${r}-${t}`, anc, rank: 2 }
      );
    });
    byeList.forEach(s => next.push(s));
    byeList = [];

    if (r === 0 && isCleanCross(next)) current = crossTables(next);
    else if (next.length <= 4) current = [next];
    else current = searchRound(next, rng);
    current = sortTables(current);
    current.forEach(g => { total += groupScore(g); });
  }
  return { rounds, total };
}

/**
 * 全回戦の枠を作る。何通りも試して、再戦が一番少ない表を採用する。
 * seedsは必ずシードにする参加者の番号(枠より多い分は無視)。
 */
function buildBracket(n, seeds = [], rng, trials) {
  if (n < 4) throw new Error('参加者は4人以上必要です');
  const random = rng || secureRandom;
  const count = trials || (n > 32 ? 60 : 200);
  let best = null;
  for (let i = 0; i < count; i++) {
    const candidate = buildOnce(n, seeds, random);
    if (!best || candidate.total < best.total) best = candidate;
  }
  return best.rounds;
}

/**
 * 決勝を中央に置く並びを返す。左から 1回戦…決勝…1回戦。
 * 各回戦の卓とシードは左右に半分ずつ分ける。決勝を含まないときは最後の回戦も左右に分ける。
 */
function bracketSides(rounds, shown) {
  const last = shown[shown.length - 1];
  const hasFinal = last === rounds.length - 1;
  const outer = hasFinal ? shown.slice(0, -1) : shown;
  const half = list => Math.ceil(list.length / 2);
  const side = (r, pick) => ({
    r,
    tables: pick([...rounds[r].tables.keys()]),
    byes: pick(rounds[r].byes),
  });
  const left = list => list.slice(0, half(list));
  const right = list => list.slice(half(list));
  const center = hasFinal ? [{ r: last, tables: [...rounds[last].tables.keys()], byes: rounds[last].byes }] : [];
  return [
    ...outer.map(r => side(r, left)),
    ...center,
    ...outer.slice().reverse().map(r => side(r, right)),
  ].filter(s => s.tables.length || s.byes.length);
}

/**
 * 決勝中央の画像の布置を決める。W×Hいっぱいに使い、名前が一番大きくなる列の分け方を選ぶ。
 * nameEmは名前の幅(文字の大きさ1pxあたり)。外側の回戦は列を分けると縦に余裕ができる。
 */
function planSides(rounds, sides, W, H, nameEm) {
  const LINK_GAP = 30, SUB_GAP = 10, PAD = 8, TAG_EM = 2.3, MAX_FONT = 38;
  const HEAD = 0.8, TABLE_GAP = 0.35, SEAT_PER_FONT = 1.75;
  const outer = sides[0].r;
  const second = sides[1] ? sides[1].r : outer;
  const chunk = (list, parts) => {
    const size = Math.ceil(list.length / parts);
    const out = [];
    for (let i = 0; i < list.length; i += size) out.push(list.slice(i, i + size));
    return out.length ? out : [list];
  };
  let best = null;
  for (let outerParts = 1; outerParts <= 3; outerParts++) {
    for (let secondParts = 1; secondParts <= 2; secondParts++) {
      const cols = [];
      sides.forEach((side, s) => {
        const isFinal = side.r === rounds.length - 1;
        const parts = isFinal ? 1 : side.r === outer ? outerParts : side.r === second ? secondParts : 1;
        chunk(side.tables, parts).forEach((tables, i) => {
          cols.push({ r: side.r, section: s, label: i === 0, tables });
        });
      });
      let gaps = 0;
      cols.forEach((col, i) => { if (i) gaps += col.section === cols[i - 1].section ? SUB_GAP : LINK_GAP; });
      const colW = (W - gaps) / cols.length;
      const units = Math.max(...cols.map(col => {
        const seats = col.tables.reduce((sum, t) => sum + rounds[col.r].tables[t].slots.length, 0);
        return seats + col.tables.length * HEAD + Math.max(0, col.tables.length - 1) * TABLE_GAP;
      }));
      const fit = H / units;
      const font = Math.min(fit / SEAT_PER_FONT * 1.05, (colW - PAD * 2) / (nameEm + TAG_EM), MAX_FONT);
      if (!best || font > best.font + 0.01) {
        const seat = Math.min(fit, font * SEAT_PER_FONT * 1.2);
        let x = 0;
        cols.forEach((col, i) => {
          if (i) x += colW + (col.section === cols[i - 1].section ? SUB_GAP : LINK_GAP);
          col.x = x;
        });
        best = { cols, colW, font, seat, head: seat * HEAD, tableGap: seat * TABLE_GAP, pad: PAD };
      }
    }
  }
  return best;
}

/* 共有: サーバーとやり取りするデータの処理 */

/** 共有リンク用のID。推測されないよう128ビットの乱数を使う。 */
function newShareId() {
  const bytes = crypto.getRandomValues(new Uint8Array(16));
  const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-_';
  let id = '', bits = 0, value = 0;
  bytes.forEach(byte => {
    value = (value << 8) | byte;
    bits += 8;
    while (bits >= 6) {
      bits -= 6;
      id += chars[(value >> bits) & 63];
    }
    value &= (1 << bits) - 1;
  });
  return id + chars[value << (6 - bits)];
}

function setTreePath(tree, keys, data) {
  if (!keys.length) return data;
  const root = tree && typeof tree === 'object' ? { ...tree } : {};
  const child = setTreePath(root[keys[0]], keys.slice(1), data);
  if (child === null || child === undefined) delete root[keys[0]];
  else root[keys[0]] = child;
  return Object.keys(root).length ? root : null;
}

/** Firebaseの受信イベント(put/patch)を手元のデータに反映した結果を返す */
function applyStreamEvent(tree, path, data, isPatch) {
  const keys = path.split('/').filter(Boolean);
  if (!isPatch) return setTreePath(tree, keys, data);
  let next = tree;
  Object.keys(data || {}).forEach(key => {
    next = setTreePath(next, keys.concat(key.split('/').filter(Boolean)), data[key]);
  });
  return next;
}

/** サーバーへ送る差分。席ごとに { '卓/席': 値 または null } で作り、他の席を上書きしない。 */
function resultPatch(before, after) {
  const patch = {};
  new Set([...Object.keys(before), ...Object.keys(after)]).forEach(key => {
    const a = before[key] || {}, b = after[key] || {};
    ['first', 'second'].forEach(field => {
      if (a[field] !== b[field]) patch[`${key}/${field}`] = b[field] === undefined ? null : b[field];
    });
  });
  return patch;
}

/** 変わった卓だけを { 卓: 新しい結果 または null } で返す */
function resultChanges(before, after) {
  const changes = {};
  new Set([...Object.keys(before), ...Object.keys(after)]).forEach(key => {
    const a = before[key] || {}, b = after[key] || {};
    if (a.first !== b.first || a.second !== b.second) changes[key] = after[key] || null;
  });
  return changes;
}

/** beforeにあってafterで消えた順位の数 */
function removedResultCount(before, after) {
  let removed = 0;
  Object.keys(before).forEach(key => {
    ['first', 'second'].forEach(field => {
      const now = after[key] ? after[key][field] : undefined;
      if (before[key][field] !== undefined && now === undefined) removed++;
    });
  });
  return removed;
}

/** 受信した結果から、表に存在する卓の正しい値だけを残す */
function cleanResults(raw, rounds) {
  const clean = {};
  Object.keys(raw || {}).forEach(key => {
    const match = /^(\d+)-(\d+)$/.exec(key);
    const round = match && rounds[Number(match[1])];
    const value = raw[key];
    if (!round || !round.tables[Number(match[2])] || !value || typeof value !== 'object') return;
    const entry = {};
    ['first', 'second'].forEach(field => { if (Number.isInteger(value[field])) entry[field] = value[field]; });
    if (Object.keys(entry).length) clean[key] = entry;
  });
  return clean;
}

/** 受信した表を読む。形が正しくなければnull。 */
function parseSharedBracket(text) {
  let data;
  try { data = JSON.parse(text); } catch (e) { return null; }
  const { players, rounds } = data || {};
  if (!Array.isArray(players) || players.length < 4 || !players.every(p => typeof p === 'string')) return null;
  if (!Array.isArray(rounds) || !rounds.length) return null;
  const validRef = (ref, r) => {
    if (!ref || typeof ref !== 'object') return false;
    if (ref.p !== undefined) return Number.isInteger(ref.p) && ref.p >= 0 && ref.p < players.length;
    return Number.isInteger(ref.r) && ref.r >= 0 && ref.r < r
      && Number.isInteger(ref.t) && ref.t >= 0 && ref.t < rounds[ref.r].tables.length
      && (ref.rank === 1 || ref.rank === 2);
  };
  const valid = rounds.every((round, r) => round && Array.isArray(round.tables) && Array.isArray(round.byes)
    && round.tables.length > 0
    && round.tables.every(t => t && Array.isArray(t.slots) && t.slots.length >= 3 && t.slots.every(s => validRef(s, r)))
    && round.byes.every(s => validRef(s, r)));
  return valid ? { players, rounds } : null;
}

/** 受信したデザインを読む。色やロゴは決まった形のものだけ通す。 */
function parseSharedDesign(text) {
  let data;
  try { data = JSON.parse(text); } catch (e) { data = null; }
  const raw = data && typeof data === 'object' ? data : {};
  const color = value => (typeof value === 'string' && /^#[0-9a-fA-F]{6}$/.test(value) ? value : null);
  return {
    title: typeof raw.title === 'string' ? raw.title.slice(0, 200) : '',
    logo: typeof raw.logo === 'string' && /^data:image\/[a-z+.-]+;base64,[A-Za-z0-9+/=]+$/.test(raw.logo) ? raw.logo : null,
    main: color(raw.main),
    accent: color(raw.accent),
    deep: !!raw.deep,
    pattern: ['gradient', 'stripe', 'dots', 'asanoha'].includes(raw.pattern) ? raw.pattern : 'gradient',
    palettes: Array.isArray(raw.palettes)
      ? raw.palettes.filter(p => p && typeof p.name === 'string' && color(p.main) && color(p.accent))
        .map(p => ({ name: p.name.slice(0, 40), main: p.main, accent: p.accent, deep: !!p.deep }))
      : [],
  };
}

/** 卓の中で「同じ卓の出身者」が同席している枠の組(再戦確定)を返す */
function sameSourcePairs(table) {
  const pairs = [];
  table.slots.forEach((a, i) => {
    table.slots.slice(i + 1).forEach(b => {
      if (a.r !== undefined && a.r === b.r && a.t === b.t) pairs.push([a, b]);
    });
  });
  return pairs;
}

function resolveRef(ref, results) {
  if (ref.p !== undefined) return ref.p;
  const res = results[`${ref.r}-${ref.t}`];
  if (!res) return null;
  const id = ref.rank === 1 ? res.first : res.second;
  return id === undefined ? null : id;
}

/** 結果を直したとき、卓にいなくなった人の結果を後ろの回から消す。消した数を返す。 */
function pruneResults(rounds, results) {
  let removed = 0;
  rounds.forEach((round, r) => {
    round.tables.forEach((table, t) => {
      const key = `${r}-${t}`;
      const res = results[key];
      if (!res) return;
      const members = table.slots.map(s => resolveRef(s, results));
      ['first', 'second'].forEach(field => {
        if (res[field] !== undefined && !members.includes(res[field])) {
          delete res[field];
          removed++;
        }
      });
      if (res.first === undefined && res.second === undefined) delete results[key];
    });
  });
  return removed;
}

/* ---------- 配色 ---------- */
function hexToRgb(hex) {
  const n = parseInt(hex.slice(1), 16);
  return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
}
function rgbToHex(rgb) {
  return '#' + rgb.map(v => Math.round(v).toString(16).padStart(2, '0')).join('');
}
/** aにbをtの割合で混ぜる */
function mixColor(a, b, t) {
  const x = hexToRgb(a), y = hexToRgb(b);
  return rgbToHex(x.map((v, i) => v + (y[i] - v) * t));
}
function luminance(hex) {
  const c = hexToRgb(hex).map(v => {
    const s = v / 255;
    return s <= 0.03928 ? s / 12.92 : Math.pow((s + 0.055) / 1.055, 2.4);
  });
  return 0.2126 * c[0] + 0.7152 * c[1] + 0.0722 * c[2];
}
function contrastRatio(a, b) {
  const x = luminance(a), y = luminance(b);
  return (Math.max(x, y) + 0.05) / (Math.min(x, y) + 0.05);
}
/** 全ての背景に対して読める濃さになるまで色を暗くする */
function darkenUntilReadable(color, backgrounds, target) {
  for (let k = 0; k <= 1; k += 0.05) {
    const c = mixColor(color, '#000000', k);
    if (backgrounds.every(bg => contrastRatio(c, bg) >= target)) return c;
  }
  return '#000000';
}

/** 画像のRGBAデータから主な色を最大5色返す。白・黒の余白より色みのある色を優先する。 */
function extractColors(data) {
  const buckets = new Map();
  for (let i = 0; i + 3 < data.length; i += 4) {
    if (data[i + 3] < 128) continue;
    const key = (data[i] >> 4) << 8 | (data[i + 1] >> 4) << 4 | (data[i + 2] >> 4);
    const b = buckets.get(key) || { n: 0, r: 0, g: 0, b: 0 };
    b.n++; b.r += data[i]; b.g += data[i + 1]; b.b += data[i + 2];
    buckets.set(key, b);
  }
  const candidates = [...buckets.values()].map(b => {
    const rgb = [b.r / b.n, b.g / b.n, b.b / b.n];
    const max = Math.max(...rgb), min = Math.min(...rgb);
    const saturation = max === 0 ? 0 : (max - min) / max;
    const plain = min > 235 || max < 25;
    return { rgb, weight: b.n * (plain ? 0.05 : 0.4 + saturation) };
  }).sort((a, b) => b.weight - a.weight);
  const picked = [];
  candidates.forEach(c => {
    if (picked.length >= 5) return;
    const far = picked.every(p => Math.hypot(p[0] - c.rgb[0], p[1] - c.rgb[1], p[2] - c.rgb[2]) > 70);
    if (far) picked.push(c.rgb);
  });
  return picked.map(rgbToHex);
}

/** 抽出した色から配色案を3つ作る */
function buildPalettes(colors) {
  if (!colors.length) return [];
  const a = colors[0];
  const b = colors[1] || a;
  return [
    { name: '淡い背景', main: a, accent: b, deep: false },
    { name: '淡い背景(色違い)', main: b, accent: a, deep: false },
    { name: '濃い背景', main: a, accent: b, deep: true },
  ];
}

const DEFAULT_THEME = {
  felt: '#1f5c4a', feltSoft: '#e2eee8', accent: '#b5361f', accentSoft: '#f8e6e0',
  bgFrom: '#f4f0e6', bgTo: '#f4f0e6', onBg: '#24231f', onBgMuted: '#6d6a60',
  roundLine: '#1f5c4a', motif: '#1f5c4a', motifAlpha: 0.1,
};

/** デザイン設定から画面と画像で共通に使う色を作る */
function themeFrom(design) {
  if (!design.main) return DEFAULT_THEME;
  const feltSoft = mixColor(design.main, '#ffffff', 0.86);
  const felt = darkenUntilReadable(design.main, ['#ffffff', feltSoft], 4.5);
  const accent = darkenUntilReadable(design.accent || design.main, ['#ffffff', '#fffdf8'], 4.5);
  const accentSoft = mixColor(accent, '#ffffff', 0.88);
  if (design.deep) {
    const bgFrom = darkenUntilReadable(felt, ['#dddddd'], 4.5);
    return {
      felt, feltSoft, accent, accentSoft,
      bgFrom, bgTo: mixColor(bgFrom, '#000000', 0.35),
      onBg: '#ffffff', onBgMuted: '#dddddd', roundLine: '#ffffff', motif: '#ffffff', motifAlpha: 0.09,
    };
  }
  return {
    felt, feltSoft, accent, accentSoft,
    bgFrom: mixColor(design.main, '#ffffff', 0.8), bgTo: mixColor(design.accent || design.main, '#ffffff', 0.8),
    onBg: '#24231f', onBgMuted: '#4a4840', roundLine: felt, motif: felt, motifAlpha: 0.1,
  };
}

function defaultDesign() {

}
let state = { draft: '', seeds: [], players: null, rounds: null, results: {}, design: defaultDesign() };
let notice = '';

// 共有中の表は、手元の表を上書きしないよう別の場所に保存する
function storageKey() {
  return shareId ? `${STORAGE_KEY}:${shareId}` : STORAGE_KEY;
}
function save() {
  if (memoryOnly) return true;
  try {
    localStorage.setItem(storageKey(), JSON.stringify({ version: SCHEMA_VERSION, ...state }));
    return true;
  } catch (e) {
    return false;
  }
}
function load() {
  try {
    const saved = JSON.parse(localStorage.getItem(storageKey()));
    if (saved && saved.version === SCHEMA_VERSION) {
      state = {
        draft: saved.draft || '', seeds: saved.seeds || [], players: saved.players || null, rounds: saved.rounds || null, results: saved.results || {},
        design: { ...defaultDesign(), ...(saved.design || {}) },
      };
    }
  } catch (e) {}
}
function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function roundName(r) {
  return r === state.rounds.length - 1 ? '決勝' : `${r + 1}回戦`;
}
function refLabel(ref, currentRound) {
  if (ref.p !== undefined) return currentRound > 0 ? 'シード' : '';
  const place = `${tableLabel(ref.t)}卓${ref.rank}位`;
  return ref.r === currentRound - 1 ? place : `${ref.r + 1}回戦${place}`;
}

function renderSetup() {

      <div id="dups"></div>
    </section>`;
  let seedNotice = '';

  const syncSeeds = names => {
    const present = normalizeSeeds(names, state.seeds, Infinity);
    const kept = normalizeSeeds(names, state.seeds, slotCount(names));
    seedNotice = kept.length < present.length
      ? `シードの枠が減ったので、${present.slice(kept.length).join('、')}の指定を外しました。`

    state.seeds = kept;
  };
  const renderSeedPicker = names => {
    const slots = slotCount(names);

    const chips = [...new Set(names)].map((name, i) => {
      const on = state.seeds.includes(name);

    }).join('');
    picker.innerHTML = `
      <div class="seed-picker">
        <div class="seed-head">2回戦から出場するシードを指定(任意)<span>${state.seeds.length}/${slots}人を選択</span></div>
        <p class="seed-note">選ばなかった枠は抽選で決まります。</p>
        <div class="seed-list">${chips}</div>

  };
  // 日本語変換を途切れさせないよう、入力欄は作り直さず周りの表示だけ更新する

      const parts = [`1回戦 ${s.sizes.length}卓`];

  });

function seatHtml(ref, r, t, res, ready) {

  const isSecond = res && res.second === id;

    <button class="rank-btn" data-r="${r}" data-t="${t}" data-id="${id}" data-rank="1" aria-pressed="${!!isFirst}" aria-label="${label}を1位にする">1位</button>
    <button class="rank-btn" data-r="${r}" data-t="${t}" data-id="${id}" data-rank="2" aria-pressed="${!!isSecond}" aria-label="${label}を2位にする">2位</button>` : '';
  return `<div class="seat" data-player="${id}">
    <span class="seat-name">${label}${origin ? `<span class="seat-origin">${esc(origin)}</span>` : ''}</span>${buttons}
  </div>`;
}

function tableHtml(table, r, t) {

  const done = res && res.first !== undefined && (isFinal || res.second !== undefined);
  const sizeNote = table.slots.length === 3 ? '<small>3人打ち</small>' : (ready && !done ? '<small>順位を入力</small>' : '');
  return `<article class="table ${done ? 'done' : ''}">
    <div class="table-head"><span>${isFinal ? '決勝卓' : `${tableLabel(t)}卓`}</span>${sizeNote}</div>
    ${table.slots.map(s => seatHtml(s, r, t, res, ready)).join('')}
  </article>`;
}

function byeTitle(r) {
  return `シード(${r + 2}回戦から出場)`;
}

function byesHtml(byes, r) {
  if (!byes.length) return '';
  const items = byes.map(ref => {
    const id = resolveRef(ref, state.results);
    const name = id === null ? refLabel(ref, r) : state.players[id];
    return `<li ${id === null ? '' : `data-player="${id}"`}>${esc(name)}</li>`;
  }).join('');
  return `<div class="byes"><strong>${esc(byeTitle(r))}</strong><ul>${items}</ul></div>`;
}

function renderBracket() {

      </section>` : ''}

    <div class="bracket">

  drawScreenLinks();

}

/** 画面の回戦の間に線を引く。各卓の位置を測って、1本の縦線へつなぐ。 */
function drawScreenLinks() {
  const bracket = app.querySelector('.bracket');
  const box = bracket.getBoundingClientRect();
  const rounds = [...bracket.querySelectorAll('.round-body')].map(body => {
    const rect = body.parentElement.getBoundingClientRect();
    return {
      left: rect.left - box.left + bracket.scrollLeft,
      right: rect.right - box.left + bracket.scrollLeft,
      ys: [...body.children].map(el => {
        const r = el.getBoundingClientRect();
        return r.top - box.top + bracket.scrollTop + r.height / 2;
      }),
    };
  });
  let path = '';
  rounds.slice(1).forEach((next, i) => {
    const prev = rounds[i];
    const barX = (prev.right + next.left) / 2;
    prev.ys.forEach(y => { path += `M${prev.right} ${y}H${barX}`; });
    next.ys.forEach(y => { path += `M${barX} ${y}H${next.left}`; });
    path += `M${barX} ${Math.min(...prev.ys, ...next.ys)}V${Math.max(...prev.ys, ...next.ys)}`;
  });
  const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  svg.classList.add('round-links');
  svg.setAttribute('width', bracket.scrollWidth);
  svg.setAttribute('height', bracket.scrollHeight);
  svg.setAttribute('aria-hidden', 'true');
  const line = document.createElementNS('http://www.w3.org/2000/svg', 'path');
  line.setAttribute('d', path);
  svg.appendChild(line);
  bracket.prepend(svg);
}

/** 決勝の結果。優勝者が決まっていなければnull。 */
function championInfo() {
  if (!state.rounds) return null;
  const res = state.results[`${state.rounds.length - 1}-0`];
  if (!res || res.first === undefined) return null;
  return {
    first: state.players[res.first],
    second: res.second === undefined ? null : state.players[res.second],
  };
}

function fitChampionName() {

  name.style.fontSize = '';

  let size = parseFloat(getComputedStyle(name).fontSize);
  while (name.scrollWidth > name.clientWidth && size > 16) {
    size *= 0.92;
    name.style.fontSize = `${size}px`;
  }

/* ---------- デザイン ---------- */
const TILE_SCALE = 2;

/** 背景の模様1枚分を描く。グラデーションのときはnull。 */
function makeTile(pattern, theme) {
  if (pattern === 'gradient') return null;
  const s = TILE_SCALE;
  const canvas = document.createElement('canvas');
  const ctx = canvas.getContext('2d');
  let cssW, cssH;
  if (pattern === 'stripe') {
    cssW = cssH = 24;
    canvas.width = canvas.height = cssW * s;
    ctx.scale(s, s);
    ctx.lineWidth = 6;
    ctx.beginPath();
    [-24, 0, 24].forEach(o => { ctx.moveTo(o, 24); ctx.lineTo(o + 24, 0); });
    setMotif(ctx, theme);
    ctx.stroke();
  } else if (pattern === 'dots') {
    cssW = cssH = 22;
    canvas.width = canvas.height = cssW * s;
    ctx.scale(s, s);
    setMotif(ctx, theme);
    ctx.beginPath();
    ctx.arc(11, 11, 2.6, 0, Math.PI * 2);
    ctx.fill();
  } else {
    // 麻の葉: 正三角形の格子に、重心から各頂点への線を足す
    const a = 40, h = a * Math.sqrt(3) / 2;
    cssW = a; cssH = 2 * h;
    canvas.width = a * s;
    canvas.height = Math.round(2 * h * s);
    ctx.scale(canvas.width / a, canvas.height / (2 * h));
    setMotif(ctx, theme);
    ctx.lineWidth = 1;
    ctx.beginPath();
    const tri = (p, q, u) => {
      const c = [(p[0] + q[0] + u[0]) / 3, (p[1] + q[1] + u[1]) / 3];
      [[p, q], [q, u], [u, p], [c, p], [c, q], [c, u]].forEach(([m, n]) => { ctx.moveTo(m[0], m[1]); ctx.lineTo(n[0], n[1]); });
    };
    for (let row = -1; row <= 2; row++) {
      const offset = Math.abs(row % 2) ? a / 2 : 0;
      for (let col = -2; col <= 2; col++) {
        const x = col * a + offset, y = row * h;
        tri([x, y + h], [x + a, y + h], [x + a / 2, y]);
        tri([x + a / 2, y], [x + a * 1.5, y], [x + a, y + h]);
      }
    }
    ctx.stroke();
  }
  return { canvas, cssW, cssH };
}
function setMotif(ctx, theme) {
  const [r, g, b] = hexToRgb(theme.motif);
  const color = `rgba(${r},${g},${b},${theme.motifAlpha})`;
  ctx.strokeStyle = color;
  ctx.fillStyle = color;
}

function applyTheme() {
  const theme = themeFrom(state.design);
  const root = document.documentElement.style;
  root.setProperty('--felt', theme.felt);
  root.setProperty('--felt-soft', theme.feltSoft);
  root.setProperty('--accent', theme.accent);
  root.setProperty('--accent-soft', theme.accentSoft);
  root.setProperty('--on-bg', theme.onBg);
  root.setProperty('--on-bg-muted', theme.onBgMuted);
  root.setProperty('--round-line', theme.roundLine);
  const tile = makeTile(state.design.pattern, theme);
  const gradient = `linear-gradient(135deg, ${theme.bgFrom}, ${theme.bgTo})`;
  document.body.style.backgroundImage = tile ? `url(${tile.canvas.toDataURL()}), ${gradient}` : gradient;
  document.body.style.backgroundSize = tile ? `${tile.cssW}px ${tile.cssH}px, auto` : 'auto';
}

/** ロゴを読み込み、保存用に縮小して、色を抽出する */
function loadLogo(file) {
  const url = URL.createObjectURL(file);
  const img = new Image();
  img.onerror = () => {
    URL.revokeObjectURL(url);
    setExportStatus('この画像は読み込めませんでした。');
  };
  img.onload = () => {
    const w = img.naturalWidth || 320, h = img.naturalHeight || 320;
    const ratio = Math.min(1, 320 / Math.max(w, h));
    const canvas = document.createElement('canvas');
    canvas.width = Math.max(1, Math.round(w * ratio));
    canvas.height = Math.max(1, Math.round(h * ratio));
    const ctx = canvas.getContext('2d');
    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
    URL.revokeObjectURL(url);
    const colors = extractColors(ctx.getImageData(0, 0, canvas.width, canvas.height).data);
    const d = state.design;
    d.logo = canvas.toDataURL('image/png');
    d.palettes = buildPalettes(colors);
    if (d.palettes.length) Object.assign(d, { main: d.palettes[0].main, accent: d.palettes[0].accent, deep: false });
    designChanged();
    renderDesignSlot();
    setExportStatus(d.palettes.length ? '' : 'ロゴから色を拾えなかったので、配色はそのままです。');
  };
  img.src = url;
}

/* ---------- 画像保存 ---------- */
const FONT_SANS = '"Hiragino Kaku Gothic ProN", "Yu Gothic UI", "Yu Gothic", Meiryo, sans-serif';
const FONT_SERIF = '"Hiragino Mincho ProN", "Yu Mincho", serif';
const IMG = { w: 1920, h: 1080, margin: 24, cardH: 88, cardGap: 16, gap: 16, blockGap: 12, colW: 256, head: 44, tableHead: 28, seat: 40, maxScale: 2, byesPerBlock: 12 };

/** 高さlimitに収まるようにブロックを列へ詰める */
function packColumns(blocks, limit) {
  const columns = [];
  let current = [], used = 0;
  blocks.forEach(block => {
    const add = block.height + IMG.blockGap;
    if (current.length && used + add > limit) {
      columns.push(current);
      current = [];
      used = 0;
    }
    current.push(block);
    used += add;
  });
  if (current.length) columns.push(current);
  return columns;
}

/** 1回戦分のブロックが1920×1080に一番大きく収まる列の組み方を探す */
function fitLayout(blocks, availW, availH) {
  const tallest = Math.max(...blocks.map(b => b.height + IMG.blockGap));
  const total = blocks.reduce((sum, b) => sum + b.height + IMG.blockGap, 0);
  let best = null;
  for (let limit = tallest; limit <= total + 1; limit += 20) {
    const columns = packColumns(blocks, limit);
    const contentW = columns.length * IMG.colW + (columns.length - 1) * IMG.gap;
    const contentH = Math.max(...columns.map(col => col.reduce((sum, b) => sum + b.height + IMG.blockGap, 0))) - IMG.blockGap + IMG.head;
    const scale = Math.min(IMG.maxScale, availW / contentW, availH / contentH);
    if (!best || scale > best.scale) best = { columns, contentW, contentH, scale };
  }
  return best;
}

/** よくある名前の幅(文字の大きさ1pxあたり)。極端に長い名前は別に縮めるので、上位1割は無視する。 */
function typicalNameEm(ctx) {
  ctx.font = `bold 100px ${FONT_SANS}`;
  const widths = state.players.map(name => ctx.measureText(name).width / 100).sort((a, b) => a - b);
  return Math.max(3, widths[Math.floor((widths.length - 1) * 0.9)]);
}

/** 決勝中央のトーナメント表を描く。シードは2回戦の席に名前が載るので一覧は出さない。 */
function drawSides(ctx, shown, x0, y0, W, H, theme) {
  const headH = 46;
  const bodyH = H - headH;
  const top = y0 + headH;
  const sides = bracketSides(state.rounds, shown);
  const plan = planSides(state.rounds, sides, W, bodyH, typicalNameEm(ctx));
  const { cols, colW, seat, head } = plan;

  // 卓は列の高さいっぱいに等間隔で置く
  cols.forEach(col => {
    const heights = col.tables.map(t => state.rounds[col.r].tables[t].slots.length * seat + head);
    const gap = (bodyH - heights.reduce((sum, h) => sum + h, 0)) / col.tables.length;
    let y = top + gap / 2;
    col.places = heights.map(h => {
      const place = { y, h };
      y += h + gap;
      return place;
    });
  });

  // 回戦の間の線。同じ回戦の列どうし(「2回戦まで」の中央など)はつながない。
  ctx.strokeStyle = theme.onBgMuted;
  ctx.lineWidth = 3;
  cols.forEach((col, i) => {
    const next = cols[i + 1];
    if (!next || next.r === col.r) return;
    const centers = c => c.places.map(p => p.y + p.h / 2);
    const barX = (x0 + col.x + colW + x0 + next.x) / 2;
    ctx.beginPath();
    centers(col).forEach(y => { ctx.moveTo(x0 + col.x + colW, y); ctx.lineTo(barX, y); });
    centers(next).forEach(y => { ctx.moveTo(barX, y); ctx.lineTo(x0 + next.x, y); });
    const all = [...centers(col), ...centers(next)];
    ctx.moveTo(barX, Math.min(...all));
    ctx.lineTo(barX, Math.max(...all));
    ctx.stroke();
  });

  // 回戦名は列の組の中央に大きく
  cols.forEach(col => {
    if (!col.label) return;
    const group = cols.filter(c => c.section === col.section);
    const left = x0 + group[0].x;
    const width = group[group.length - 1].x + colW - group[0].x;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = theme.onBg;
    ctx.font = `bold 26px ${FONT_SERIF}`;
    ctx.fillText(roundName(col.r), left + width / 2, y0 + 18);
    ctx.textAlign = 'left';
    ctx.fillStyle = theme.roundLine;
    ctx.fillRect(left, y0 + 37, width, 3);
  });

  cols.forEach(col => {
    col.tables.forEach((t, i) => drawSideTable(ctx, plan, col.r, t, x0 + col.x, col.places[i], theme));
  });
}

function drawSideTable(ctx, plan, r, t, x, place, theme) {
  const { colW: w, seat, head, font, pad } = plan;
  const table = state.rounds[r].tables[t];
  const res = state.results[`${r}-${t}`];
  const isFinal = r === state.rounds.length - 1;
  const done = res && res.first !== undefined && (isFinal || res.second !== undefined);
  const headColor = isFinal ? theme.accent : theme.felt;

  ctx.save();
  roundedRect(ctx, x, place.y, w, place.h, 8);
  ctx.fillStyle = '#ffffff';
  ctx.fill();
  ctx.clip();
  ctx.textBaseline = 'middle';
  ctx.fillStyle = headColor;
  ctx.fillRect(x, place.y, w, head);
  ctx.fillStyle = '#ffffff';
  ctx.font = `bold ${Math.max(10, font * 0.85)}px ${FONT_SANS}`;
  ctx.fillText(isFinal ? '決勝卓' : `${tableLabel(t)}卓`, x + pad, place.y + head / 2);
  if (table.slots.length === 3) {
    ctx.textAlign = 'right';
    ctx.font = `${Math.max(9, font * 0.6)}px ${FONT_SANS}`;
    ctx.fillText('3人打ち', x + w - pad, place.y + head / 2);
    ctx.textAlign = 'left';
  }

  let y = place.y + head;
  table.slots.forEach((ref, i) => {
    const center = y + seat / 2;
    if (i) {
      ctx.fillStyle = '#d9d3c3';
      ctx.fillRect(x, y, w, 1);
    }
    const id = resolveRef(ref, state.results);
    const origin = refLabel(ref, r);
    if (id === null) {
      ctx.fillStyle = '#6d6a60';
      drawFitted(ctx, origin, x + pad, center, w - pad * 2, font * 0.9, 9, s => `${s}px ${FONT_SANS}`);
    } else {
      const rank = res && res.first === id ? 1 : res && res.second === id ? 2 : 0;
      if (rank) {
        ctx.fillStyle = theme.feltSoft;
        ctx.fillRect(x, y + (i ? 1 : 0), w, seat - (i ? 1 : 0));
      }
      // 右端は順位が決まっていれば順位、なければ「シード」「A卓1位」
      let rightW = 0;
      if (rank) {
        ctx.font = `bold ${Math.max(10, font * 0.72)}px ${FONT_SANS}`;
        const label = `${rank}位`;
        const pillW = ctx.measureText(label).width + 12;
        const pillH = Math.min(seat - 4, font * 1.3);
        roundedRect(ctx, x + w - pad - pillW, center - pillH / 2, pillW, pillH, 5);
        ctx.fillStyle = headColor;
        ctx.fill();
        ctx.fillStyle = '#ffffff';
        ctx.textAlign = 'center';
        ctx.fillText(label, x + w - pad - pillW / 2, center);
        ctx.textAlign = 'left';
        rightW = pillW + 6;
      } else if (origin) {
        ctx.font = `${Math.max(9, font * 0.6)}px ${FONT_SANS}`;
        rightW = ctx.measureText(origin).width + 6;
        ctx.fillStyle = '#6d6a60';
        ctx.textAlign = 'right';
        ctx.fillText(origin, x + w - pad, center);
        ctx.textAlign = 'left';
      }
      ctx.fillStyle = '#1b1a17';
      drawFitted(ctx, state.players[id], x + pad, center, w - pad * 2 - rightW, font, 9, s => `bold ${s}px ${FONT_SANS}`);
    }
    y += seat;
  });
  ctx.restore();

  roundedRect(ctx, x + 0.5, place.y + 0.5, w - 1, place.h - 1, 8);
  ctx.strokeStyle = done || isFinal ? headColor : '#b9b3a3';
  ctx.lineWidth = isFinal ? 3 : done ? 2 : 1;
  ctx.stroke();
}

function roundedRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

/** 幅に収まるよう文字を縮め、それでも長ければ末尾を省略して描く */
function drawFitted(ctx, text, x, y, maxW, size, minSize, font) {
  let s = size;
  ctx.font = font(s);
  while (s > minSize && ctx.measureText(text).width > maxW) {
    s -= 1;
    ctx.font = font(s);
  }
  let out = text;
  if (ctx.measureText(out).width > maxW) {
    while (out && ctx.measureText(out + '…').width > maxW) out = out.slice(0, -1);
    out += '…';
  }
  ctx.fillText(out, x, y);
}

function tableBlock(table, r, t) {
  return { kind: 'table', table, r, t, height: IMG.tableHead + table.slots.length * IMG.seat };
}
/** シードの一覧。人数が多いときは列をまたげるよう分割する。 */
function byeBlocks(byes, r) {
  const names = byes.map(ref => {
    const id = resolveRef(ref, state.results);
    return id === null ? refLabel(ref, r) : state.players[id];
  });
  const blocks = [];
  for (let i = 0; i < names.length; i += IMG.byesPerBlock) {
    const part = names.slice(i, i + IMG.byesPerBlock);
    blocks.push({ kind: 'byes', r, names: part, height: 30 + part.length * 20 });
  }
  return blocks;
}

function drawTable(ctx, block, x, y, theme) {
  const { table, r, t, height } = block;
  const w = IMG.colW;
  const key = `${r}-${t}`;
  const res = state.results[key];
  const isFinal = r === state.rounds.length - 1;
  const done = res && res.first !== undefined && (isFinal || res.second !== undefined);

  ctx.save();
  roundedRect(ctx, x, y, w, height, 8);
  ctx.fillStyle = '#fffdf8';
  ctx.fill();
  ctx.clip();
  ctx.fillStyle = theme.feltSoft;
  ctx.fillRect(x, y, w, IMG.tableHead);
  ctx.textBaseline = 'middle';
  ctx.fillStyle = theme.felt;
  ctx.font = `bold 13px ${FONT_SANS}`;
  ctx.fillText(isFinal ? '決勝卓' : `${tableLabel(t)}卓`, x + 10, y + IMG.tableHead / 2);
  if (table.slots.length === 3) {
    ctx.font = `12px ${FONT_SANS}`;
    ctx.fillStyle = '#6d6a60';
    ctx.textAlign = 'right';
    ctx.fillText('3人打ち', x + w - 10, y + IMG.tableHead / 2);
    ctx.textAlign = 'left';
  }

  let sy = y + IMG.tableHead;
  table.slots.forEach(ref => {
    ctx.fillStyle = '#d9d3c3';
    ctx.fillRect(x, sy, w, 1);
    const id = resolveRef(ref, state.results);
    const origin = refLabel(ref, r);
    if (id === null) {
      ctx.fillStyle = '#6d6a60';
      ctx.font = `13px ${FONT_SANS}`;
      ctx.fillText(origin, x + 10, sy + IMG.seat / 2);
    } else {
      const rank = res && res.first === id ? 1 : res && res.second === id ? 2 : 0;
      const nameW = w - 20 - (rank ? 44 : 0);
      ctx.fillStyle = '#24231f';
      drawFitted(ctx, state.players[id], x + 10, sy + (origin ? 14 : IMG.seat / 2), nameW, 14, 10, s => `${s}px ${FONT_SANS}`);
      if (origin) {
        ctx.fillStyle = '#6d6a60';
        ctx.font = `11px ${FONT_SANS}`;
        ctx.fillText(origin, x + 10, sy + 30);
      }
      if (rank) {
        roundedRect(ctx, x + w - 46, sy + 9, 36, 22, 5);
        ctx.fillStyle = theme.felt;
        ctx.fill();
        ctx.fillStyle = '#ffffff';
        ctx.font = `bold 12px ${FONT_SANS}`;
        ctx.textAlign = 'center';
        ctx.fillText(`${rank}位`, x + w - 28, sy + 20);
        ctx.textAlign = 'left';
      }
    }
    sy += IMG.seat;
  });

  ctx.restore();

  roundedRect(ctx, x + 0.5, y + 0.5, w - 1, height - 1, 8);
  ctx.strokeStyle = done ? theme.felt : '#d9d3c3';
  ctx.lineWidth = 1;
  ctx.stroke();
}

function drawByes(ctx, block, x, y, theme) {
  roundedRect(ctx, x, y, IMG.colW, block.height, 8);
  ctx.fillStyle = '#fffdf8';
  ctx.fill();
  ctx.setLineDash([4, 3]);
  ctx.strokeStyle = '#d9d3c3';
  ctx.stroke();
  ctx.setLineDash([]);
  ctx.textBaseline = 'middle';
  ctx.fillStyle = theme.accent;
  ctx.font = `bold 12px ${FONT_SANS}`;
  ctx.fillText(byeTitle(block.r), x + 10, y + 16);
  ctx.fillStyle = '#24231f';
  block.names.forEach((name, i) => {
    drawFitted(ctx, name, x + 10, y + 36 + i * 20, IMG.colW - 20, 13, 10, s => `${s}px ${FONT_SANS}`);
  });
}

/** 画像にする回戦と、その呼び名(全体のときは空) */
function exportScope(target) {
  if (target === 'all') return { shown: state.rounds.map((_, r) => r), label: '' };
  if (target === 'to2') return { shown: [0, 1], label: '2回戦まで' };
  if (target === 'champion') return { shown: [], label: '優勝者' };
  return { shown: [Number(target)], label: roundName(Number(target)) };
}

async function exportImage(target) {
  setExportStatus('画像を作っています…');
  try {
    const blob = await renderImage(target);
    const title = (state.design.title || '麻雀トーナメント表').replace(/[\\/:*?"<>|]/g, '_');
    const suffix = exportScope(target).label || '全体';
    const link = document.createElement('a');
    link.href = URL.createObjectURL(blob);
    link.download = `${title}_${suffix}.png`;
    link.click();
    setTimeout(() => URL.revokeObjectURL(link.href), 10000);
    setExportStatus(`${link.download} を保存しました`);
  } catch (e) {
    setExportStatus('画像を作れませんでした。回戦ごとの保存を試してください。');
  }
}

async function renderImage(target) {
  const theme = themeFrom(state.design);
  const d = state.design;
  const finalRes = state.results[`${state.rounds.length - 1}-0`];
  const { shown, label: scopeLabel } = exportScope(target);
  const bodyY = IMG.margin + IMG.cardH + IMG.cardGap;
  const availW = IMG.w - IMG.margin * 2;
  const availH = IMG.h - bodyY - IMG.margin;

  const canvas = document.createElement('canvas');
  canvas.width = IMG.w;
  canvas.height = IMG.h;
  const ctx = canvas.getContext('2d');

  const gradient = ctx.createLinearGradient(0, 0, IMG.w, IMG.h);
  gradient.addColorStop(0, theme.bgFrom);
  gradient.addColorStop(1, theme.bgTo);
  ctx.fillStyle = gradient;
  ctx.fillRect(0, 0, IMG.w, IMG.h);
  const tile = makeTile(d.pattern, theme);
  if (tile) {
    const pattern = ctx.createPattern(tile.canvas, 'repeat');
    pattern.setTransform(new DOMMatrix().scale(1 / TILE_SCALE));
    ctx.fillStyle = pattern;
    ctx.fillRect(0, 0, IMG.w, IMG.h);
  }
  ctx.textBaseline = 'middle';

  if (target === 'champion') {
    await drawChampionImage(ctx, theme);
    return canvasToBlob(canvas);
  }

  // 見出しカード(ロゴ・大会名・優勝者を横一列に)
  const cardW = availW;
  const cardCenter = IMG.margin + IMG.cardH / 2;
  roundedRect(ctx, IMG.margin, IMG.margin, cardW, IMG.cardH, 8);
  ctx.fillStyle = '#fffdf8';
  ctx.fill();
  let textX = IMG.margin + 18;
  if (d.logo) {
    const logo = new Image();
    logo.src = d.logo;
    await logo.decode();
    const ratio = Math.min(160 / logo.naturalWidth, 68 / logo.naturalHeight);
    const lw = logo.naturalWidth * ratio, lh = logo.naturalHeight * ratio;
    ctx.drawImage(logo, textX, cardCenter - lh / 2, lw, lh);
    textX += lw + 16;
  }
  const champion = finalRes && finalRes.first !== undefined && shown.includes(state.rounds.length - 1)
    ? `優勝: ${state.players[finalRes.first]}${finalRes.second !== undefined ? ` / 準優勝: ${state.players[finalRes.second]}` : ''}`
    : '';
  const cardRight = IMG.margin + cardW - 18;
  const championW = champion ? Math.min(760, cardW * 0.42) : 0;
  const titleW = cardRight - textX - (champion ? championW + 24 : 0);
  ctx.fillStyle = '#24231f';
  drawFitted(ctx, d.title || '麻雀トーナメント表', textX, cardCenter - 12, titleW, 30, 14, s => `bold ${s}px ${FONT_SERIF}`);
  ctx.fillStyle = '#6d6a60';
  ctx.font = `16px ${FONT_SANS}`;
  ctx.fillText(`${state.players.length}人・全${state.rounds.length}回戦${scopeLabel ? `・${scopeLabel}` : ''}`, textX, cardCenter + 20);
  if (champion) {
    const bx = cardRight - championW;
    roundedRect(ctx, bx, IMG.margin + 20, championW, IMG.cardH - 40, 6);
    ctx.fillStyle = theme.accentSoft;
    ctx.fill();
    ctx.fillStyle = '#24231f';
    drawFitted(ctx, champion, bx + 14, cardCenter, championW - 28, 18, 11, s => `bold ${s}px ${FONT_SANS}`);
  }

  if (shown.length > 1) {
    drawSides(ctx, shown, IMG.margin, bodyY, availW, availH, theme);
  } else {
    // 1回戦分だけのときは、空いた場所の中央に計算した倍率で描く
    const r = shown[0];
    const round = state.rounds[r];
    const blocks = round.tables.map((table, t) => tableBlock(table, r, t));
    blocks.unshift(...byeBlocks(round.byes, r));
    const layout = fitLayout(blocks, availW, availH);
    ctx.save();
    const scaledW = layout.contentW * layout.scale;
    const scaledH = layout.contentH * layout.scale;
    ctx.translate(IMG.margin + (availW - scaledW) / 2, bodyY + (availH - scaledH) / 2);
    ctx.scale(layout.scale, layout.scale);
    ctx.textBaseline = 'middle';
    ctx.fillStyle = theme.onBg;
    ctx.font = `bold 16px ${FONT_SERIF}`;
    ctx.fillText(roundName(r), 0, 12);
    const nameW = ctx.measureText(roundName(r)).width;
    ctx.fillStyle = theme.onBgMuted;
    ctx.font = `12px ${FONT_SANS}`;
    ctx.fillText(`${round.tables.length}卓${round.byes.length ? `・シード${round.byes.length}` : ''}`, nameW + 8, 13);
    layout.columns.forEach((col, c) => {
      const x = c * (IMG.colW + IMG.gap);
      ctx.fillStyle = theme.roundLine;
      ctx.fillRect(x, 28, IMG.colW, 2);
      let y = IMG.head;
      col.forEach(block => {
        if (block.kind === 'table') drawTable(ctx, block, x, y, theme);
        else drawByes(ctx, block, x, y, theme);
        y += block.height + IMG.blockGap;
      });
    });
    ctx.restore();
  }

  return canvasToBlob(canvas);
}

function canvasToBlob(canvas) {
  return new Promise((resolve, reject) => {
    canvas.toBlob(blob => (blob ? resolve(blob) : reject(new Error('toBlob failed'))), 'image/png');
  });
}

/** 優勝者の画像。ロゴ・大会名・優勝・名前・準優勝を中央に縦に並べる。 */
async function drawChampionImage(ctx, theme) {
  const info = championInfo();
  if (!info) throw new Error('優勝者が決まっていません');
  const { title, logo: logoSrc } = state.design;
  const cardX = 120, cardY = 70, cardW = IMG.w - 240, cardH = IMG.h - 140;
  const textW = cardW - 160;
  const centerX = IMG.w / 2;

  roundedRect(ctx, cardX, cardY, cardW, cardH, 24);
  ctx.fillStyle = '#fffdf8';
  ctx.fill();
  ctx.strokeStyle = theme.accent;
  ctx.lineWidth = 6;
  ctx.stroke();

  let logo = null, logoW = 0, logoH = 0;
  if (logoSrc) {
    logo = new Image();
    logo.src = logoSrc;
    await logo.decode();
    const ratio = Math.min(520 / logo.naturalWidth, 190 / logo.naturalHeight);
    logoW = logo.naturalWidth * ratio;
    logoH = logo.naturalHeight * ratio;
  }

  // 載せるものの高さを足して、カードの中央にそろえる
  const parts = [];
  if (logo) parts.push({ height: logoH + 30, draw: y => ctx.drawImage(logo, centerX - logoW / 2, y, logoW, logoH) });
  if (title) {
    parts.push({ height: 90, draw: y => {
      ctx.fillStyle = '#24231f';
      drawFitted(ctx, title, centerX, y + 36, textW, 58, 20, s => `bold ${s}px ${FONT_SERIF}`);
    } });
  }
  parts.push({ height: 130, draw: y => {
    ctx.font = `bold 70px ${FONT_SANS}`;
    const pillW = ctx.measureText('優勝').width + 70;
    roundedRect(ctx, centerX - pillW / 2, y, pillW, 104, 14);
    ctx.fillStyle = theme.accent;
    ctx.fill();
    ctx.fillStyle = '#ffffff';
    ctx.fillText('優勝', centerX, y + 54);
  } });
  parts.push({ height: 240, draw: y => {
    ctx.fillStyle = '#1b1a17';
    drawFitted(ctx, info.first, centerX, y + 112, textW, 190, 40, s => `bold ${s}px ${FONT_SERIF}`);
  } });
  if (info.second !== null) {
    parts.push({ height: 80, draw: y => {
      ctx.fillStyle = '#5c5a52';
      drawFitted(ctx, `準優勝: ${info.second}`, centerX, y + 40, textW, 52, 20, s => `${s}px ${FONT_SANS}`);
    } });
  }
  const total = parts.reduce((sum, part) => sum + part.height, 0);
  let y = cardY + (cardH - total) / 2;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  parts.forEach(part => {
    part.draw(y);
    y += part.height;
  });
  ctx.textAlign = 'left';
}

app.addEventListener('click', e => {
  const btn = e.target.closest('.rank-btn');
  if (!btn) return;
  const key = `${btn.dataset.r}-${btn.dataset.t}`;
  const id = Number(btn.dataset.id);
  const field = btn.dataset.rank === '1' ? 'first' : 'second';
  const other = field === 'first' ? 'second' : 'first';
  const before = JSON.parse(JSON.stringify(state.results));
  const res = state.results[key] || (state.results[key] = {});
  if (res[field] === id) {
    delete res[field];
  } else {
    if (res[other] === id) delete res[other];
    res[field] = id;
  }
  if (res.first === undefined && res.second === undefined) delete state.results[key];
  const removed = pruneResults(state.rounds, state.results);
  notice = removed ? `結果の修正に合わせて、後の回の順位を${removed}件取り消しました。もう一度入力してください。` : '';
  confirmingReset = false;
  save();
  render();
  if (share) publishResults(before);
});

function highlight(id, on) {
  app.querySelectorAll(`[data-player="${id}"]`).forEach(el => el.classList.toggle('hl', on));
}
app.addEventListener('mouseover', e => {
  const el = e.target.closest('[data-player]');
  if (el) highlight(el.dataset.player, true);
});
app.addEventListener('mouseout', e => {
  const el = e.target.closest('[data-player]');
  if (el) highlight(el.dataset.player, false);
});

async function copyShareLink() {
  const input = document.getElementById('share-link');
  try {
    await navigator.clipboard.writeText(shareLink());
    shareMessage = 'リンクをコピーしました。';
  } catch (err) {
    input.select();
    shareMessage = 'コピーできませんでした。選択したリンクを手動でコピーしてください。';
  }
  const selected = document.activeElement === input;
  renderShareSlot();
  if (selected) document.getElementById('share-link').select();
}

function newShareState() {
  return { status: 'connecting', tree: null, loaded: false, pending: 0, queue: Promise.resolve(), failed: false, bracket: null, design: null, designTimer: null, source: null, retryTimer: null };
}

async function shareRequest(id, path, method, body) {
  const url = `${SHARE_DB_URL}/tournaments/${id}${path}.json?print=silent`;
  const res = await fetch(url, {
    method,
    headers: { 'Content-Type': 'application/json' },
    body: body === undefined ? undefined : JSON.stringify(body),
  });
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
}

async function startShare() {
  const design = encodeDesign();
  if (design.length > MAX_DESIGN_LENGTH) {
    shareMessage = 'ロゴが大きすぎて共有できません。小さい画像にしてください。';
    renderShareSlot();
    return;
  }
  const id = newShareId();
  const bracket = encodeBracket();
  const payload = { v: 1, bracket, design, createdAt: Date.now() };
  if (Object.keys(state.results).length) payload.results = state.results;
  shareMessage = '共有を始めています…';
  renderShareSlot();
  try {
    await shareRequest(id, '', 'PUT', payload);
  } catch (err) {
    shareMessage = '共有を始められませんでした。通信状況を確認して、もう一度押してください。';
    renderShareSlot();
    return;
  }
  shareId = id;
  memoryOnly = false;
  share = newShareState();
  share.tree = JSON.parse(JSON.stringify(payload));
  share.loaded = true;
  share.bracket = bracket;
  share.design = design;
  shareMessage = 'リンクをコピーして、運営メンバーに送ってください。';
  history.replaceState(null, '', shareLink());
  save();
  // このブラウザで始めた共有は、終わったら手元の表として残してよい
  try { localStorage.setItem(`${storageKey()}:owner`, '1'); } catch (e) {}
  connectShare();
  render();
}

function connectShare() {
  if (!share) return;
  const current = share;
  const source = new EventSource(`${SHARE_DB_URL}/tournaments/${shareId}.json`);
  current.source = source;
  const onEvent = isPatch => e => {
    if (share !== current) return;
    let message;
    try { message = JSON.parse(e.data); } catch (err) { return; }
    if (!message || typeof message.path !== 'string') return;
    current.tree = applyStreamEvent(current.tree, message.path, message.data, isPatch);
    setShareStatus('online');
    if (current.tree === null) finishShare();
    else syncFromTree();
  };
  source.addEventListener('put', onEvent(false));
  source.addEventListener('patch', onEvent(true));
  source.addEventListener('open', () => { if (share === current) setShareStatus('online'); });
  source.addEventListener('error', () => {
    if (share !== current) return;
    setShareStatus('offline');
    // 自動で再接続しない状態になったら、作り直す
    if (source.readyState === EventSource.CLOSED) {
      clearTimeout(current.retryTimer);
      current.retryTimer = setTimeout(connectShare, 5000);
    }
  });
  // サーバー側でルールが変わったときなどに届く
  ['cancel', 'auth_revoked'].forEach(name => source.addEventListener(name, () => {
    if (share !== current) return;
    source.close();
    setShareStatus('offline');
    clearTimeout(current.retryTimer);
    current.retryTimer = setTimeout(connectShare, 5000);
  }));
}

function setShareStatus(status) {
  if (!share || share.status === status) return;
  share.status = status;
  // つながり直したら、通信失敗のお知らせは片付ける
  if (status === 'online' && share.failed) {
    share.failed = false;
    shareMessage = '';
  }
  renderShareSlot();
}

/** サーバーの最新の内容を画面へ反映する。自分の送信中は結果が巻き戻らないよう待つ。 */
function syncFromTree() {
  if (!share || share.pending || !share.tree) return;
  const tree = share.tree;
  let changed = false;
  const firstLoad = !share.loaded;

  if (tree.bracket !== share.bracket) {
    const parsed = parseSharedBracket(tree.bracket);
    if (!parsed) {
      shareMessage = '共有された表を読み込めませんでした。';
      share.loaded = true;
      render();
      return;
    }
    state.players = parsed.players;
    state.rounds = parsed.rounds;
    state.results = {};
    share.bracket = tree.bracket;
    designSlot.innerHTML = '';
    notice = firstLoad ? '' : 'ほかの運営メンバーが抽選し直しました。';
    confirmingReset = false;
    changed = true;
  }

  if (tree.design !== share.design && !share.designTimer) {
    share.design = tree.design;
    state.design = { ...defaultDesign(), ...parseSharedDesign(tree.design) };
    applyTheme();
    renderEventHead();
    // 入力中の欄は作り直さない
    if (designSlot.firstChild && !designSlot.contains(document.activeElement)) renderDesignSlot();
    changed = true;
  }

  if (state.rounds) {
    const next = cleanResults(tree.results, state.rounds);
    pruneResults(state.rounds, next);
    if (Object.keys(resultChanges(state.results, next)).length) {
      const removed = removedResultCount(state.results, next);
      if (removed && !firstLoad) notice = `ほかの運営メンバーの修正で、順位を${removed}件取り消しました。`;
      state.results = next;
      changed = true;
    }
  }

  share.loaded = true;
  if (changed || firstLoad) {
    save();
    render();
  }
}

/**
 * 共有中の書き込み。失敗したらサーバーの内容へ戻す。
 * 同時に送ると通信の順番が入れ替わって古い内容が残るので、1件ずつ順番に送る。
 */
function shareWrite(path, method, body, failure) {
  const current = share;
  if (!current) return;
  const id = shareId;
  current.pending++;
  current.queue = current.queue.then(() => sendShareWrite(current, id, path, method, body, failure));
}

async function sendShareWrite(current, id, path, method, body, failure) {
  try {
    await shareRequest(id, path, method, body);
    current.failed = false;
    shareMessage = '';
  } catch (err) {
    current.failed = true;
    shareMessage = failure;
  } finally {
    current.pending--;
    if (share === current) {
      syncFromTree();
      renderShareSlot();
    }
  }
}

function publishResults(before) {
  const changes = resultPatch(before, state.results);
  if (!Object.keys(changes).length) return;
  shareWrite('/results', 'PATCH', changes,'結果を保存できませんでした。通信状況を確認してください。');
}

function publishBracket() {
  share.bracket = encodeBracket();
  shareWrite('', 'PATCH', { bracket: share.bracket, results: null }, '抽選結果を保存できませんでした。通信状況を確認してください。');
}

function publishDesignSoon() {
  clearTimeout(share.designTimer);
  const current = share;
  current.designTimer = setTimeout(() => {
    current.designTimer = null;
    if (share !== current) return;
    const design = encodeDesign();
    if (design.length > MAX_DESIGN_LENGTH) {
      shareMessage = 'ロゴが大きすぎて共有できません。小さい画像にしてください。';
      renderShareSlot();
      return;
    }
    current.design = design;
    shareWrite('', 'PATCH', { design }, 'デザインを保存できませんでした。通信状況を確認してください。');
  }, 700);
}

async function endShare() {
  if (!confirmingEnd) {
    confirmingEnd = true;
    renderShareSlot();
    setTimeout(() => {
      if (confirmingEnd) {
        confirmingEnd = false;
        renderShareSlot();
      }
    }, 4000);
    return;
  }
  confirmingEnd = false;
  try {
    await shareRequest(shareId, '', 'DELETE');
    finishShare();
  } catch (err) {
    shareMessage = '共有を終えられませんでした。通信状況を確認して、もう一度押してください。';
    renderShareSlot();
  }
}

/** 共有の終了。表は手元に残すが、手元に別の表があれば上書きしない。 */
function finishShare() {
  if (!share) return;
  const wasLoaded = share.loaded;
  if (share.source) share.source.close();
  clearTimeout(share.retryTimer);
  clearTimeout(share.designTimer);
  let owner = false;
  try {
    owner = localStorage.getItem(`${storageKey()}:owner`) === '1';
    localStorage.removeItem(storageKey());
    localStorage.removeItem(`${storageKey()}:owner`);
  } catch (e) {}
  share = null;
  shareId = null;
  confirmingEnd = false;
  history.replaceState(null, '', location.pathname);

  if (!wasLoaded && !state.rounds) {
    load();
    applyTheme();
    shareMessage = 'この共有リンクの大会は見つかりませんでした。共有が終わった可能性があります。';
    designSlot.innerHTML = '';
    render();
    return;
  }
  let local = null;
  try { local = JSON.parse(localStorage.getItem(STORAGE_KEY)); } catch (e) {}
  const sameTable = owner || !local || !local.rounds
    || JSON.stringify([local.players, local.rounds]) === JSON.stringify([state.players, state.rounds]);
  if (sameTable) {
    shareMessage = '共有を終えました。この表はこのブラウザに残っています。';
    save();
  } else {
    memoryOnly = true;
    shareMessage = '共有は終了しました。このブラウザにある別の表を消さないよう、この表は保存していません。ページを閉じると消えるので、必要なら画像を保存してください。';
  }
  render();
}

const linkedShare = new URLSearchParams(location.search).get(SHARE_LINK_PARAM);
if (SHARE_DB_URL && linkedShare && /^[A-Za-z0-9_-]{20,64}$/.test(linkedShare)) {
  shareId = linkedShare;
  share = newShareState();
}
load();
applyTheme();
render();
if (share) connectShare();
</script>
</body>
</html>
